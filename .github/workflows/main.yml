name: desktop-build-action-dev

on:
  workflow_dispatch:

jobs:
  # 打包Linux
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true
      - name: Update apt-get
        run: sudo apt-get update
      - name: Install Dependencies
        run: sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev libmpv-dev mpv
      - name: Enable Flutter Desktop
        run: flutter config --enable-linux-desktop
      - name: Restore packages
        run: |
          sed -i 's/auto_orientation_v2: \^2.3.6/auto_orientation_v2: 2.3.6/' simple_live_app/pubspec.yaml
          rm -f simple_live_app/pubspec.lock
          cd simple_live_app
          flutter pub get
      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor
      - name: Build Linux (force clean + DIRECT_DISPATCH=0)
        run: |
          cd simple_live_app
          rm -rf build .dart_tool
          flutter pub get
          # Patch quickjs.c DIRECT_DISPATCH=0 right before build (git dep gets re-checked out by pub get)
          for base in "$PUB_CACHE" "$HOME/.pub-cache" /home/runner/.pub-cache; do
            DQ=$(find "$base" -maxdepth 2 -type d -name "dart_quickjs*" 2>/dev/null | head -1)
            [ -n "$DQ" ] && break
          done
          echo "patching dir: ${DQ:-NOT_FOUND}"
          [ -n "$DQ" ] || { echo "dart_quickjs source NOT found"; exit 1; }
          F="$DQ/third_party/quickjs-ng/quickjs.c"
          [ -f "$F" ] || { echo "no quickjs.c at $F"; exit 1; }
          sed -i 's/#define DIRECT_DISPATCH 1/#define DIRECT_DISPATCH 0/' "$F"
          grep -n "#define DIRECT_DISPATCH" "$F" || true
          # Fix symbol interposition (js_free resolved to libmujs.so from media_kit/mpv/ffmpeg
          # => SIGSEGV when QuickJS frees). Bind internal refs to own exports with -Bsymbolic.
          HB="$DQ/dq_build.dart"
          [ -f "$HB" ] || HB="$DQ/hook/build.dart"
          echo "hook file: ${HB:-NOT_FOUND}"
          if [ -n "$HB" ] && [ -f "$HB" ]; then
            awk '/-fwrapv/{print; print "          '\''-Wl,-Bsymbolic'\'', // bind to own exports (fix libmujs interposition)"; next}1' "$HB" > "$HB.tmp" && mv "$HB.tmp" "$HB"
            grep -n "Bsymbolic" "$HB" || true
          else
            echo "WARNING: dq_build.dart not found, cannot patch -Bsymbolic"
          fi
          # Build
          flutter build linux --release
          echo "--- native asset outputs ---"
          find build -name "libdart_quickjs.so" 2>/dev/null
          echo "jump table count in native asset:"
          objdump -d build/native_assets/linux/libdart_quickjs.so 2>/dev/null | grep -cE "jmpq? *\*%(rax|rbx|rcx|rdx|rsi|rdi|r8|r9|r10|r11|r12|r13|r14|r15)" || true
          echo "jump table count in bundle:"
          objdump -d build/linux/x64/release/bundle/lib/libdart_quickjs.so 2>/dev/null | grep -cE "jmpq? *\*%(rax|rbx|rcx|rdx|rsi|rdi|r8|r9|r10|r11|r12|r13|r14|r15)" || true
      - name: Package Linux deb+zip manually
        run: |
          cd simple_live_app
          VER=1.11.4+11104
          DEBROOT="build/dist/${VER}/simple_live_app-${VER}-linux_deb"
          mkdir -p "$DEBROOT/DEBIAN" "$DEBROOT/opt/simple_live_app" \
            "$DEBROOT/usr/share/applications" \
            "$DEBROOT/usr/share/icons/hicolor/128x128/apps" \
            "$DEBROOT/usr/share/icons/hicolor/256x256/apps"
          cp -fr build/linux/x64/release/bundle/. "$DEBROOT/opt/simple_live_app/"
          printf 'Package: simple-live\nVersion: %s\nSection: x11\nPriority: optional\nArchitecture: amd64\nDepends: libmpv2\nInstalled-Size: 24400\nMaintainer: xiaoyaocz <xiaoyaocz@52uwp.com>\nDescription: Simple Live APP\n' "$VER" \
            > "$DEBROOT/DEBIAN/control"
          printf '#!/bin/sh\nset -e\nif command -v update-desktop-database >/dev/null 2>&1; then update-desktop-database >/dev/null 2>&1 || true; fi\nexit 0\n' > "$DEBROOT/DEBIAN/postinst"
          chmod +x "$DEBROOT/DEBIAN/postinst"
          dpkg-deb --build --root-owner-group "$DEBROOT" "build/dist/${VER}/simple_live_app-${VER}-linux.deb"
          cd "build/dist/${VER}"
          cp -r simple_live_app-${VER}-linux_deb/opt/simple_live_app ./
          zip -qr "simple_live_app-${VER}-linux.zip" simple_live_app
          ls -la
      - name: Inject deb dependency on libmpv
        run: |
          set -e
          deb=$(ls simple_live_app/build/dist/*/*.deb)
          dpkg-deb -I "$deb" | grep -E "Package|Depends"
      - name: Upload Linux to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: warn
          path: |
            simple_live_app/build/dist/*/*.deb
            simple_live_app/build/dist/*/*.zip

  # 打包Windows
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true
      - name: Enable Flutter Desktop
        run: flutter config --enable-windows-desktop
      - name: Restore packages
        shell: bash
        run: |
          sed -i 's/auto_orientation_v2: \^2.3.6/auto_orientation_v2: 2.3.6/' simple_live_app/pubspec.yaml
          rm -f simple_live_app/pubspec.lock
          cd simple_live_app
          flutter pub get
      - name: Patch experimental coroutine for new MSVC
        shell: bash
        run: |
          for f in \
            "$PUB_CACHE"/hosted/pub.dev/flutter_inappwebview_windows-*/windows/CMakeLists.txt \
            "$PUB_CACHE"/hosted/pub.dev/permission_handler_windows-*/windows/CMakeLists.txt; do
            if [ -f "$f" ]; then
              if ! grep -q "SILENCE_EXPERIMENTAL_COROUTINE" "$f"; then
                sed -i '/cmake_minimum_required/a add_compile_definitions(_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)' "$f"
                echo 'target_compile_definitions(${PLUGIN_NAME} PRIVATE _SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)' >> "$f"
              fi
            fi
          done
          grep -l "SILENCE_EXPERIMENTAL_COROUTINE" "$PUB_CACHE"/hosted/pub.dev/*/windows/CMakeLists.txt 2>/dev/null || true
      - name: Build Windows
        shell: bash
        run: |
          cd simple_live_app
          rm -rf build .dart_tool
          flutter pub get
          flutter build windows --release
          echo "--- native asset dll ---"
          find build/windows -name "libdart_quickjs*.dll" 2>/dev/null || true
          mkdir -p build/dist
          ZIP="build/dist/simple_live_app-1.11.4+11104-windows.zip"
          (cd build/windows/x64/runner/Release && zip -r - .) > "$ZIP"
          echo "zip: $(ls -la "$ZIP" | awk '{print $5}') bytes"
      - name: Upload Windows to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: warn
          path: |
            simple_live_app/build/dist/*.zip